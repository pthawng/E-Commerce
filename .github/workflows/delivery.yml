name: Delivery & Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  verify-integrity:
    name: Verify Code Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Shared Dependencies
        run: cd shared && npm ci
      - name: Build Shared Module
        run: cd shared && npm run build
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      - name: Backend Build Check (Principal Integrity Gate)
        run: cd backend && npm run build

  build-and-push:
    name: Build and Push Docker Image
    needs: verify-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ray-paradis-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ github.sha }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/ray-paradis-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'ghcr.io/${{ github.repository_owner }}/ray-paradis-backend:${{ github.sha }}'
          artifact-name: sbom.json
          output-format: cyclonedx-json

  # Real Deployment trigger for Render (Backend)
  deploy:
    name: Trigger Render Deployment
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      
      - name: Wait for Stability (Health Polling)
        run: npx ts-node scripts/verify-deploy.ts
        env:
            DEPLOY_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        # L8 Note: Ensure RENDER_DEPLOY_HOOK_URL is added to GitHub Secrets
